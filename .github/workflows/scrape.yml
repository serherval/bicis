name: Scrape BIKI Valladolid

on:
  schedule:
    - cron: '0 7,12,17 * * *'
      timezone: 'Europe/Madrid'  # Fuerza la ejecución en hora local de España
  workflow_dispatch: {}          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2

      - name: Cachear e instalar paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::dplyr
            any::tidyr
            any::readr
            any::ggplot2
            any::sf
            any::rmarkdown
            any::flexdashboard
            any::crosstalk
            any::plotly

      - name: Ejecutar scraper
        run: Rscript scripts/scrape_biki.R

      - name: Generar ranking (PNG para Twitter/X)
        run: Rscript scripts/generar_ranking.R

      - name: Renderizar dashboard estático (GitHub Pages)
        run: Rscript -e 'rmarkdown::render("dashboard.Rmd", output_file = "docs/index.html")'

      - name: Commit y push si hay cambios
        run: |
          git config user.name "biki-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
